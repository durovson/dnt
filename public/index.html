<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="JAMMM profile">
  <title>JAMMM</title>
  <style>
    :root{--lime:#adc322;--orange:#e97731;--mint:#d6e5d2;--bg:#080908;--sheet:#18181b;--text:#fff;--muted:rgba(235,235,245,.58);--font:Arial,Helvetica,sans-serif}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);font-family:var(--font);font-synthesis:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    body{min-width:320px;color:var(--text)}
    button,input{font:inherit;appearance:none;-webkit-appearance:none}
    button{border:0}
    a{text-decoration:none;color:inherit}
    .page{position:relative;min-height:100svh;overflow:hidden;isolation:isolate;background:#080908}
    .backdrop{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(.92) contrast(1.08) brightness(.43)}
    .vignette{position:fixed;inset:0;pointer-events:none;background:linear-gradient(140deg,rgba(7,8,7,.52),rgba(10,9,8,.56) 48%,rgba(12,8,6,.72)),radial-gradient(circle at 50% 20%,rgba(26,26,20,.02),rgba(0,0,0,.62) 78%)}
    .profile{position:relative;z-index:1;width:min(100%,34rem);min-height:100svh;margin:auto;padding:calc(2.75rem + env(safe-area-inset-top,0px)) 1rem calc(4.5rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;justify-content:center}
    .avatar-wrap{position:relative;margin-bottom:1rem;filter:drop-shadow(0 1.3rem 2.6rem rgba(0,0,0,.5))}
    .avatar{width:clamp(5.75rem,24vw,7rem);height:clamp(5.75rem,24vw,7rem);border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.2);box-shadow:0 0 0 .45rem rgba(255,255,255,.03),0 1.25rem 2.75rem rgba(0,0,0,.5)}
    .online{position:absolute;right:.18rem;bottom:.18rem;width:.9rem;height:.9rem;border-radius:50%;background:#47d164;border:.2rem solid #17171b}
    h1{margin:.08rem 0 .08rem;font-size:clamp(3.8rem,16vw,5.8rem);line-height:.92;letter-spacing:-.055em;font-weight:800}
    .handle{margin:0;color:var(--muted);font-size:1.02rem}
    .actions{width:min(100%,32rem);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem;margin-top:1.6rem}
    .action{min-height:3.35rem;padding:.65rem .9rem;display:flex;align-items:center;justify-content:center;gap:.62rem;border:1px solid rgba(255,255,255,.14);border-radius:1.15rem;background:rgba(18,18,21,.78);backdrop-filter:blur(1.3rem) saturate(130%);-webkit-backdrop-filter:blur(1.3rem) saturate(130%);box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 .75rem 2rem rgba(0,0,0,.22);font-size:1rem;font-weight:700;color:var(--mint)}
    .mark{width:2.05rem;height:2.05rem;flex:0 0 2.05rem;border-radius:50%;display:grid;place-items:center;background:rgba(214,229,210,.1);color:var(--mint);overflow:hidden}
    .mark svg{display:block;width:18px;height:18px;max-width:100%;max-height:100%}
    .support{width:min(100%,18rem);min-height:3.35rem;margin-top:.7rem;background:linear-gradient(135deg,var(--lime),var(--orange));color:var(--mint);border:1px solid rgba(214,229,210,.22);border-radius:999px;box-shadow:0 .8rem 2rem rgba(173,195,34,.2);font-size:1rem;font-weight:700;cursor:pointer}
    .overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(.35rem);-webkit-backdrop-filter:blur(.35rem);opacity:0;pointer-events:none;transition:opacity .22s ease}
    .overlay.open{opacity:1;pointer-events:auto}
    .sheet{width:100%;max-width:34rem;max-height:88dvh;overflow:auto;background:linear-gradient(180deg,#1d1d20,#151518);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:0 -1rem 3rem rgba(0,0,0,.35);touch-action:pan-y}
    .overlay.open .sheet{transform:translateY(0)}
    .sheet-inner{padding:.2rem 1rem calc(1rem + env(safe-area-inset-bottom,0px));font-size:16px}
    .grabber-zone{height:2.3rem;display:grid;place-items:center;touch-action:none}.grabber{width:2.7rem;height:.28rem;border-radius:999px;background:rgba(255,255,255,.2)}
    .sheet-header{min-height:3rem;display:flex;align-items:center;padding-right:3.3rem}
    .sheet-title{font-size:2rem;font-weight:800;line-height:1.05}
    .close{position:absolute;top:12px;right:12px;width:48px;height:48px;border-radius:50%;background:#25252a;color:#fff;display:grid;place-items:center;font-size:32px;line-height:1;z-index:2}
    .section{margin-top:1rem}.label{margin:0 0 .55rem .15rem;color:rgba(235,235,245,.66);font-size:.83rem;line-height:1.2;font-weight:700;letter-spacing:.035em}
    .card{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.08);border-radius:1.25rem;background:rgba(8,8,10,.36)}
    .currency{position:relative;width:100%;min-height:4.65rem;padding:.75rem .9rem;display:grid;grid-template-columns:2.55rem minmax(0,1fr) 2rem;align-items:center;gap:.72rem;background:transparent;color:inherit;text-align:left;cursor:pointer}
    .currency.selected{background:linear-gradient(90deg,rgba(173,195,34,.25),rgba(173,195,34,.085) 62%,rgba(214,229,210,.035))}
    .currency-icon{width:2.55rem;height:2.55rem}.currency-icon img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
    .currency-copy{min-width:0;display:grid;gap:.12rem}.currency-title{font-size:1rem;font-weight:700}.currency-sub{color:rgba(235,235,245,.55);font-size:.86rem}
    .check{min-width:2rem;min-height:2rem;display:grid;place-items:center;color:var(--lime)}.check svg{width:21px;height:21px;display:block}.check path{fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
    .divider{position:absolute;left:4.18rem;right:1rem;bottom:0;height:1px;background:rgba(255,255,255,.08)}
    .amount-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem}.amount{min-height:3.15rem;padding:0 .35rem;border:1px solid rgba(255,255,255,.11);border-radius:.95rem;background:rgba(255,255,255,.025);color:rgba(255,255,255,.94);font-size:.98rem;font-weight:700;cursor:pointer}.amount.active{background:rgba(173,195,34,.28);border-color:rgba(173,195,34,.68);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
    .custom{margin-top:.55rem}.custom input{width:100%;height:3.15rem;border:1px solid rgba(255,255,255,.11);border-radius:.95rem;background:rgba(255,255,255,.025);color:#fff;padding:0 1rem;outline:none}.custom input::placeholder{color:rgba(255,255,255,.38)}
    .cta{margin-top:1rem}.send{width:100%;min-height:3.35rem;background:linear-gradient(135deg,var(--lime),var(--orange));color:var(--mint);border:1px solid rgba(214,229,210,.22);border-radius:999px;font-weight:700;font-size:1rem;cursor:pointer}.send:disabled{opacity:.45;cursor:not-allowed}.hint{margin:.9rem 0 0;text-align:center;color:rgba(235,235,245,.36);font-size:.9rem}
    @media (min-width:48rem){.profile{padding-top:4rem}.overlay{align-items:center}.sheet{border-radius:24px;max-height:min(45rem,calc(100dvh - 2rem))}.close{top:12px;right:12px}}
  </style>
</head>
<body>
  <main class="page">
    <img class="backdrop" src="./assets/profile-bg.jpg" alt="">
    <div class="vignette" aria-hidden="true"></div>
    <section class="profile">
      <div class="avatar-wrap"><img class="avatar" src="./assets/avatar.jpg" alt="JAMMM avatar"><span class="online"></span></div>
      <h1>JAMMM</h1>
      <div class="handle">@not_jammm</div>
      <div class="actions">
        <a class="action" href="https://t.me/devofnot" target="_blank" rel="noreferrer">
          <span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 4.1 17 19.7c-.22 1.07-.84 1.34-1.7.84l-4.82-3.55-2.34 2.25c-.25.25-.46.46-.95.46l.34-4.72 8.7-7.86c.38-.35-.08-.54-.59-.19l-10.77 6.78-4.33-1.35c-.94-.29-.96-.94.2-1.4L17.43 3.9c.74-.28 1.38.17 1.08.2l1.69.01Z" fill="currentColor"/></svg></span><span>Channel</span>
        </a>
        <a class="action" href="https://notcollective.is-a.dev" target="_blank" rel="noreferrer">
          <span class="mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M12 10.5V16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="7.5" r="1" fill="currentColor"/></svg></span><span>About</span>
        </a>
      </div>
      <button class="support" id="supportBtn">Support</button>
    </section>
  </main>
  <div class="overlay" id="overlay" aria-hidden="true">
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Support">
      <button class="close" id="closeBtn" aria-label="Close">×</button>
      <div class="sheet-inner">
        <div class="grabber-zone" id="grabberZone"><div class="grabber"></div></div>
        <div class="sheet-header"><div class="sheet-title">Support</div></div>
        <section class="section">
          <div class="label">CHOOSE A CURRENCY</div>
          <div class="card" id="currencies">
            <button class="currency selected" data-currency="GRAM"><span class="currency-icon"><img src="./assets/gram.svg" alt=""></span><span class="currency-copy"><span class="currency-title">Gram</span><span class="currency-sub">GRAM</span></span><span class="check">✓</span><span class="divider"></span></button>
            <button class="currency" data-currency="USDT"><span class="currency-icon"><img src="./assets/usdt.svg" alt=""></span><span class="currency-copy"><span class="currency-title">USDT on TON</span><span class="currency-sub">USDT</span></span><span class="check"></span></button>
          </div>
        </section>
        <section class="section">
          <div class="label">CHOOSE AN AMOUNT</div>
          <div class="amount-grid" id="amounts">
            <button class="amount active" data-amount="5">5</button><button class="amount" data-amount="10">10</button><button class="amount" data-amount="25">25</button><button class="amount" data-amount="custom">Custom</button>
          </div>
          <div class="custom" id="customWrap" hidden><input id="customInput" inputmode="decimal" autocomplete="off" placeholder="Enter amount"></div>
        </section>
        <div class="cta"><button class="send" id="sendBtn">Send 5 GRAM</button><div class="hint">Your TON wallet will open for confirmation.</div></div>
      </div>
    </section>
  </div>
<script>
(() => {
  const RECIPIENT='UQDlmQfncLTHp_ceI6gz8eA19wQ2cia9ysskYO-ZA1IANpDx';
  const USDT_MASTER='EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs';
  let currency='GRAM', amount='5';
  const overlay=document.getElementById('overlay'), sheet=document.getElementById('sheet');
  const support=document.getElementById('supportBtn'), closeBtn=document.getElementById('closeBtn'), sendBtn=document.getElementById('sendBtn');
  const customWrap=document.getElementById('customWrap'), customInput=document.getElementById('customInput');
  const currencyButtons=[...document.querySelectorAll('.currency')], amountButtons=[...document.querySelectorAll('.amount')];
  const smallest=(v,d)=>{const n=(v||'').trim().replace(',','.');if(!/^\d+(\.\d+)?$/.test(n))return null;const [w,f='']=n.split('.');if(f.length>d)return null;return BigInt(w)*10n**BigInt(d)+BigInt(f.padEnd(d,'0')||'0')};
  function currentAmount(){return amount==='custom'?customInput.value.trim():amount}
  function links(){const v=currentAmount();const u=smallest(v,currency==='GRAM'?9:6);if(u===null||u<=0n)return null;const text=encodeURIComponent('Support • JAMMM');const q=currency==='GRAM'?`amount=${u}&text=${text}`:`jetton=${USDT_MASTER}&amount=${u}&text=${text}`;return {ton:`ton://transfer/${RECIPIENT}?${q}`,https:`https://app.tonkeeper.com/transfer/${RECIPIENT}?${q}`}}
  function render(){currencyButtons.forEach(b=>{const yes=b.dataset.currency===currency;b.classList.toggle('selected',yes);b.querySelector('.check').textContent=yes?'✓':''});amountButtons.forEach(b=>b.classList.toggle('active',b.dataset.amount===amount));customWrap.hidden=amount!=='custom';const v=currentAmount();sendBtn.textContent=`Send ${v||'0'} ${currency}`;sendBtn.disabled=!links()}
  function open(){overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
  function close(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');document.body.style.overflow=''}
  support.addEventListener('click',open);closeBtn.addEventListener('click',close);overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
  currencyButtons.forEach(b=>b.addEventListener('click',()=>{currency=b.dataset.currency;render()}));
  amountButtons.forEach(b=>b.addEventListener('click',()=>{amount=b.dataset.amount;if(amount==='custom'){customInput.focus()}render()}));
  customInput.addEventListener('input',render);
  sendBtn.addEventListener('click',()=>{const l=links();if(!l)return;const touch=window.matchMedia('(pointer:coarse)').matches;window.location.href=touch?l.ton:l.https});
  let startY=null,lastY=null,dragging=false;
  const start=e=>{const p=e.touches?e.touches[0]:e;startY=p.clientY;lastY=startY;dragging=true;sheet.style.transition='none'};
  const move=e=>{if(!dragging)return;const p=e.touches?e.touches[0]:e;lastY=p.clientY;const dy=Math.max(0,lastY-startY);sheet.style.transform=`translateY(${dy}px)`};
  const end=()=>{if(!dragging)return;const dy=Math.max(0,lastY-startY);dragging=false;sheet.style.transition='';sheet.style.transform='';if(dy>90)close()};
  document.getElementById('grabberZone').addEventListener('touchstart',start,{passive:true});document.getElementById('grabberZone').addEventListener('touchmove',move,{passive:true});document.getElementById('grabberZone').addEventListener('touchend',end);
  render();
})();
</script>
</body>
</html>
