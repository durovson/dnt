<title>JAMMM — Support</title>
<style>
:root{color-scheme:dark;--lime:#adc322;--orange:#e97731;--mint:#d6e5d2;font-family:"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-width:320px;background:#0a0a0c;color:#fff;font-family:"Segoe UI",Arial,sans-serif}#root{min-height:100svh}
#fallback{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(135deg,rgba(7,7,7,.64),rgba(12,12,12,.58) 48%,rgba(17,15,14,.72)),#0a0a0c}
#fallback[hidden]{display:none}.fb-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.82) contrast(1.08) brightness(.42)}.fb-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(7,7,7,.58),rgba(12,12,12,.52) 48%,rgba(17,15,14,.64))}
.fb-content{position:relative;width:min(100%,34rem);min-height:100svh;padding:2.75rem 1rem 4.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center}.fb-avatar{width:clamp(5.75rem,24vw,7rem);height:clamp(5.75rem,24vw,7rem);border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.2);box-shadow:0 0 0 .45rem rgba(255,255,255,.03),0 1.25rem 2.75rem rgba(0,0,0,.5)}.fb-avatar-wrap{position:relative;margin-bottom:1rem}.fb-dot{position:absolute;right:.18rem;bottom:.2rem;width:.9rem;height:.9rem;border-radius:50%;background:#47d164;border:.2rem solid #17171b}.fb-name{margin:.08rem 0 .06rem;font-size:2.15rem;line-height:1.05;letter-spacing:-.035em;font-weight:750}.fb-handle{margin:0;color:rgba(235,235,245,.62);font-size:1.05rem}.fb-actions{width:min(100%,32rem);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem;margin-top:1.6rem}.fb-action,.fb-support{min-height:3.35rem;border-radius:1.15rem;font:650 1rem "Segoe UI",Arial,sans-serif}.fb-action{display:flex;align-items:center;justify-content:center;gap:.62rem;border:1px solid rgba(255,255,255,.14);background:rgba(18,18,21,.74);color:var(--mint);text-decoration:none}.fb-mark{width:2.05rem;height:2.05rem;border-radius:50%;display:grid;place-items:center;background:rgba(214,229,210,.10)}.fb-mark svg{width:18px;height:18px}.fb-support{width:min(100%,18rem);margin-top:.7rem;color:var(--mint);border:1px solid rgba(214,229,210,.22);background:linear-gradient(135deg,var(--lime),var(--orange));box-shadow:0 .8rem 2rem rgba(173,195,34,.20)}
#fb-backdrop{position:fixed;inset:0;z-index:10001;background:rgba(0,0,0,.58);opacity:0;pointer-events:none;transition:opacity .28s}#fb-backdrop.open{opacity:1;pointer-events:auto}
#fb-sheet{position:fixed;left:50%;bottom:0;z-index:10002;width:min(100%,34rem);transform:translate(-50%,110%);transition:transform .28s;border-radius:24px 24px 0 0;overflow:hidden;background:rgba(20,20,23,.99);box-shadow:0 -1rem 3rem rgba(0,0,0,.4)}#fb-sheet.open{transform:translate(-50%,0)}
.fb-sheet-inner{padding:.2rem 1rem calc(1rem + env(safe-area-inset-bottom,0px))}.fb-grab-zone{min-height:2rem;display:grid;place-items:center;touch-action:none;cursor:grab}.fb-grab{width:2.7rem;height:.28rem;border-radius:999px;background:rgba(255,255,255,.2)}.fb-sheet-title{min-height:3rem;display:flex;align-items:center;padding:.15rem .1rem 0;font-size:1.25rem;font-weight:750}.fb-label{margin:1rem 0 .55rem .15rem;color:rgba(235,235,245,.55);font-size:.75rem;font-weight:700;letter-spacing:.04em}.fb-card{overflow:hidden;border:1px solid rgba(255,255,255,.08);border-radius:1.25rem;background:rgba(8,8,10,.36)}.fb-currency{position:relative;width:100%;min-height:4.65rem;padding:.75rem .9rem;display:grid;grid-template-columns:2.55rem minmax(0,1fr) 2rem;align-items:center;gap:.72rem;border:0;background:transparent;color:var(--mint);text-align:left}.fb-currency.selected{background:linear-gradient(90deg,rgba(173,195,34,.22),rgba(173,195,34,.08) 62%,rgba(214,229,210,.035))}.fb-currency img{width:2.55rem;height:2.55rem;border-radius:50%;object-fit:cover}.fb-title{font-size:1rem;font-weight:700}.fb-sub{color:rgba(235,235,245,.55);font-size:.86rem}.fb-check{color:var(--lime);text-align:center;font-size:1.1rem}.fb-amounts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem}.fb-amount{min-height:3.15rem;border:1px solid rgba(255,255,255,.11);border-radius:.95rem;background:rgba(255,255,255,.025);color:var(--mint);font:700 .98rem "Segoe UI",Arial,sans-serif}.fb-amount.selected{background:rgba(173,195,34,.28);border-color:rgba(173,195,34,.55)}.fb-custom{width:100%;min-height:3.3rem;margin-top:.65rem;padding:0 .9rem;border-radius:1rem;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#fff;font:650 1.05rem "Segoe UI",Arial,sans-serif}.fb-cta{margin-top:1.15rem}.fb-send{width:100%;min-height:3.4rem;border-radius:1rem;border:1px solid rgba(214,229,210,.24);background:linear-gradient(135deg,var(--lime),var(--orange));color:var(--mint);font:650 1rem "Segoe UI",Arial,sans-serif}.fb-hint{text-align:center;margin:.6rem 0;color:rgba(235,235,245,.45);font-size:.82rem}.fb-close{position:absolute;top:.8rem;right:.8rem;z-index:3;width:2.5rem;height:2.5rem;border:0;border-radius:50%;background:rgba(255,255,255,.08);color:#fff;font-size:1.2rem}@media(min-width:48rem){#fb-sheet{bottom:1rem;border-radius:24px}.fb-sheet-inner{padding-inline:1.5rem}.fb-content{max-width:42rem}}
</style></head><body>
